# 카메라 브리지 — 확인·데이터셋 생성 전용
# 켜면 RTF 약 22% 저하 (0.54 -> 0.42 실측). 주행·매핑 중에는 끈다.
# 주의: 1920×1080 RGB 를 10 Hz 로 브리지하면 초당 약 62 MB 가 ROS 로 흐른다.
# ros_gz #368 이 지적한 RTF 저하가 여기서 난다. 주행 개발 중에는 꺼두고,
# 로봇 확인·데이터셋 생성 때만 켜는 것을 권한다 (--cameras 인자 참조).
- ros_topic_name: "/cam/left/image"
  gz_topic_name: "/cam/left/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam/right/image"
  gz_topic_name: "/cam/right/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam/forward/image"
  gz_topic_name: "/cam/forward/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam/left/camera_info"
  gz_topic_name: "/cam/left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/cam/right/camera_info"
  gz_topic_name: "/cam/right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
